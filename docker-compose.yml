services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: utility_monitor
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: utility_monitor_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d utility_monitor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
